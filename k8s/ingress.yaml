# The actual "Kubernetes ingress" the PDF asks for, on top of the CSP load
# balancer already covered by the Service. k8s/alb-controller.yaml is what
# watches this object and provisions/manages the real ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-todo
  namespace: secure-todo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # IP target type: ALB talks straight to pod IPs instead of NodePort.
    # Needs the controller's IRSA role to manage security groups, which the
    # copied-from-upstream IAM policy already covers - no manual SG wiring.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure-todo
                port:
                  number: 80
