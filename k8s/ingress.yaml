# The actual "Kubernetes ingress" the PDF asks for, on top of the CSP load
# balancer already covered by the Service. k8s/alb-controller.yaml is what
# watches this object and provisions/manages the real ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-todo
  namespace: secure-todo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # IP target type: ALB talks straight to pod IPs instead of NodePort.
    # Needs the controller's IRSA role to manage security groups, which the
    # copied-from-upstream IAM policy already covers - no manual SG wiring.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    # 2 replicas, in-memory HttpSession, no shared session store (see
    # application.yml - server.servlet.session). Without this, the ALB
    # round-robins each request to either pod independently, so the CSRF
    # token/session a login's GET mints on one pod often doesn't exist on
    # whichever pod its POST lands on next - login fails every time.
    # Duration matches server.servlet.session.timeout (30m) so stickiness
    # doesn't expire out from under an active session. This masks the
    # symptom rather than fixing statelessness - accepted trade-off here
    # since the alternative (spring-session-data-mongodb) would make login
    # depend on the Mongo VM, which has no HA and is an intentionally
    # fragile part of this exercise. Real fix for production: externalize
    # sessions instead of pinning traffic.
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=1800
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure-todo
                port:
                  number: 80
