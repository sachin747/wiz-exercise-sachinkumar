# Kept separate from k8s/alb-controller.yaml (rendered with
# serviceAccount.create=false) because the IAM role ARN doesn't exist until
# Terraform creates it - same REPLACED_BY_PIPELINE pattern as the app image
# in k8s/deployment.yaml. app.yml looks up the real ARN by name
# (infra/terraform/alb-controller.tf's aws_iam_role.alb_controller) and
# patches it in before the controller starts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: REPLACED_BY_PIPELINE
