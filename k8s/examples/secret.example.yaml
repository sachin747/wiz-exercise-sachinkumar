# Schema reference only - do NOT commit a filled-in copy.
#
# The application pipeline creates this Secret at deploy time, entirely from
# GitHub Actions secrets -- no AWS Secrets Manager involved. MONGO_APP_PASSWORD
# is the same value Terraform used to create the Mongo user in the first
# place; TODO_USER_PASSWORD/TODO_ADMIN_PASSWORD seed the app's own login
# accounts. See .github/workflows/app.yml.
#
# Lives in examples/ so `kubectl apply -f k8s/` (non-recursive) never touches
# it — that command would otherwise overwrite the real Secret with these
# placeholder values on every deploy.
apiVersion: v1
kind: Secret
metadata:
  name: secure-todo-secrets
  namespace: secure-todo
type: Opaque
stringData:
  mongodb-uri: mongodb://todo_app:FROM_GITHUB_SECRET_MONGO_APP_PASSWORD@10.20.0.x:27017/todo?authSource=todo
  user-name: todo-user
  user-password: FROM_GITHUB_SECRET_TODO_USER_PASSWORD
  admin-name: todo-admin
  admin-password: FROM_GITHUB_SECRET_TODO_ADMIN_PASSWORD
