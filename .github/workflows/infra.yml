# Pipeline 1 of 2 - infrastructure as code. Pull request runs scan + plan
# (no AWS mutation), push to main runs scan + apply, manual dispatch can do
# any of plan/apply/destroy.
#
# OIDC federation means no long-lived AWS keys in GitHub. Checkov + Trivy
# scan the IaC before anything ever applies. environment: aws lets apply
# require a manual reviewer if you turn that on. The concurrency group stops
# two applies from racing on the same state file.
name: Infrastructure (Terraform)

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infrastructure
  cancel-in-progress: false

env:
  # Single source of truth for region - set once as a repo variable, not
  # edited here. Every terraform init/plan/apply/destroy below also passes
  # it explicitly, so nothing silently falls back to variables.tf's default.
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_DIR: infra/terraform

jobs:
  # Gate 1: static analysis, before any of this touches AWS.
  scan:
    name: Scan IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

      # soft_fail because the deliberate weaknesses are expected findings -
      # printed straight to the job log and reviewed live in the
      # presentation instead. No Security-tab upload: this account's plan
      # doesn't include Advanced Security on a private repo, so
      # github/codeql-action/upload-sarif has nothing to upload to.
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate 2: plan, runs on every PR so reviewers see the diff. Deliberately
  # excludes push-to-main: apply also runs there, and since these are two
  # independent jobs (neither needs the other), both would start at once
  # and race for the same S3 state lock - whichever loses fails instantly
  # with "Error acquiring the state lock". Push to main only needs apply.
  plan:
    name: Plan
    needs: scan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform plan -no-color -input=false \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="ssh_public_key=${{ vars.MONGO_SSH_PUBLIC_KEY }}" \
            -var="cluster_admin_role_arn=${{ vars.CLUSTER_ADMIN_ROLE_ARN }}" \
            -var="mongo_app_password=${{ secrets.MONGO_APP_PASSWORD }}"

  # Gate 3: apply, only from main or an explicit manual dispatch.
  apply:
    name: Apply
    needs: scan
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform apply -auto-approve -input=false \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="ssh_public_key=${{ vars.MONGO_SSH_PUBLIC_KEY }}" \
            -var="cluster_admin_role_arn=${{ vars.CLUSTER_ADMIN_ROLE_ARN }}" \
            -var="mongo_app_password=${{ secrets.MONGO_APP_PASSWORD }}"

      - name: Summarise outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "### Infrastructure outputs"
            echo '```'
            terraform output
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  destroy:
    name: Destroy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform destroy -auto-approve -input=false \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="ssh_public_key=${{ vars.MONGO_SSH_PUBLIC_KEY }}" \
            -var="cluster_admin_role_arn=${{ vars.CLUSTER_ADMIN_ROLE_ARN }}" \
            -var="mongo_app_password=${{ secrets.MONGO_APP_PASSWORD }}"
